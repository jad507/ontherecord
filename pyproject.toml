[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontherecord"
version = "0.1.0"
description = "Run AI transcription and coding pipelines where every result carries a receipt of how it was made"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jeffrey De Lucca", email = "jad507@psu.edu" }]
# The core (runner, receipts, the stages that only move text) needs nothing heavy, so it installs anywhere.
# Stages that need torch or yt-dlp may run in a different Python environment; see machine.example.yaml.
dependencies = ["pyyaml>=6", "psutil>=5.9"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
download = ["yt-dlp>=2026.3.17"]
audio = ["numpy>=1.26", "soundfile>=0.12", "faster-whisper>=1.2", "pyannote.audio>=4.0.7", "torch==2.11.*",
         "torchaudio==2.11.*", "av<16"]  # PyAV 16 breaks faster-whisper's decode_audio
mcp = ["mcp>=2.3"]
# The stress test stages (StressTest, WhiStress): transformers 5 for WhiStress's Whisper, librosa for its resampling.
stress = ["ontherecord[audio]", "transformers>=5.10", "librosa>=0.10", "pyarrow>=15", "huggingface_hub>=0.30"]
# Everything in one environment: what the installers and the Docker image use.
all = ["ontherecord[server,download,audio,mcp,stress]"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ontherecord = "ontherecord.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Which PyTorch build, as a dependency group: the installers ask hwdetect.py and pass one with
# `--no-default-groups --group NAME`; without that, cu128. cu128 has kernels for Turing to Blackwell, cu126 for Maxwell
# to Hopper (so a GTX 10-series card needs it), cpu is a tenth of the size for machines with no NVIDIA card. PyPI's own
# builds are out: CPU-only on Windows, and CUDA 13 on Linux, which faster-whisper's CTranslate2 cannot share an
# environment with (see hwdetect.py). macOS takes PyPI's build in every group; it uses the Apple GPU.
[dependency-groups]
cu128 = ["torch==2.11.*", "torchaudio==2.11.*"]
cu126 = ["torch==2.11.*", "torchaudio==2.11.*"]
cpu = ["torch==2.11.*", "torchaudio==2.11.*"]

[tool.uv]
default-groups = ["cu128"]
conflicts = [[{ group = "cu128" }, { group = "cu126" }, { group = "cpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", group = "cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu128", group = "cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.package-data]
ontherecord = ["static/*", "prompts/*.txt"]
