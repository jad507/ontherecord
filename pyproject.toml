[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontherecord"
version = "0.1.0"
description = "Run AI transcription and coding pipelines where every result carries a receipt of how it was made"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jeffrey De Lucca", email = "jad507@psu.edu" }]
# The core (runner, receipts, the stages that only move text) needs nothing heavy, so it installs anywhere.
# Stages that need torch or yt-dlp may run in a different Python environment; see machine.example.yaml.
dependencies = ["pyyaml>=6", "psutil>=5.9"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
download = ["yt-dlp>=2026.3.17"]
audio = ["numpy>=1.26", "soundfile>=0.12", "faster-whisper>=1.2", "pyannote.audio>=4.0.7", "torch==2.11.*",
         "torchaudio==2.11.*", "av<16"]  # PyAV 16 breaks faster-whisper's decode_audio
mcp = ["mcp>=2.3"]
# Everything in one environment: what the installers and the Docker image use.
all = ["ontherecord[server,download,audio,mcp]"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ontherecord = "ontherecord.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Windows and Linux get PyTorch's CUDA 12.8 builds: PyPI has only CPU builds for Windows, and PyPI's Linux builds need
# CUDA 13 (a newer NVIDIA driver than many machines have). macOS uses PyPI's builds, which use the Apple GPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.package-data]
ontherecord = ["static/*", "prompts/*.txt"]
