<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On the Record</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
<header>
  <div class="brand"><span class="mark">●</span> On the Record</div>
  <nav>
    <button data-tab="build" class="active">Build a run</button>
    <button data-tab="jobs">Jobs</button>
    <button data-tab="results">Results</button>
  </nav>
  <div id="machine" class="muted"></div>
</header>

<main>
  <!-- BUILD -->
  <section id="tab-build" class="tab active">
    <div class="build">
      <div class="form">
        <div class="row">
          <label>Start from
            <select id="recipe-pick"><option value="">— a saved recipe —</option></select>
          </label>
        </div>
        <div class="row two">
          <label>Name <input id="r-name" placeholder="council-left-channel"></label>
          <label>Description <input id="r-desc" placeholder="what this run is for"></label>
        </div>
        <fieldset>
          <legend>Source</legend>
          <label>Video or audio links, one per line
            <textarea id="r-urls" rows="3" placeholder="https://www.youtube.com/watch?v=..."></textarea></label>
          <label>Or files on this machine, one path per line
            <textarea id="r-files" rows="2" placeholder="/data/meetings/*.mp4"></textarea></label>
        </fieldset>
        <fieldset>
          <legend>Stages</legend>
          <div id="stages"></div>
          <div class="add">
            <select id="add-stage"></select>
            <button id="add-btn" class="secondary">Add stage</button>
          </div>
        </fieldset>
      </div>
      <aside class="side">
        <div class="actions">
          <button id="plan-btn" class="secondary">Check plan</button>
          <button id="save-btn" class="secondary">Save recipe</button>
          <button id="submit-btn">Submit job</button>
        </div>
        <div id="build-msg" class="msg"></div>
        <div id="plan"></div>
        <details open><summary>Recipe file</summary><pre id="yaml"></pre></details>
      </aside>
    </div>
  </section>

  <!-- JOBS -->
  <section id="tab-jobs" class="tab">
    <table id="jobs" class="list">
      <thead><tr><th>Run</th><th>Status</th><th>Progress</th><th>Submitted</th><th>Took</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="job-log-wrap" hidden>
      <h3>Log <span id="job-log-id" class="muted"></span></h3>
      <pre id="job-log" class="log"></pre>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="tab-results" class="tab">
    <div class="results">
      <div class="runs"><h3>Runs</h3><ul id="runs"></ul></div>
      <div class="grid-wrap">
        <div id="run-head"></div>
        <div id="grid"></div>
        <div id="receipt"></div>
      </div>
    </div>
  </section>
</main>

<div id="modal" hidden><div class="modal-box"><button class="close" id="modal-close">×</button><div id="modal-body"></div></div></div>
<script src="/static/app.js"></script>
</body>
</html>
