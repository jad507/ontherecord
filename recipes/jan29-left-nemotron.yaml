name: jan29-left-nemotron
description: >-
  One meeting (Jan 29, 2026, 31 minutes) through Nemotron 3.5 Transcribe instead of pyannote and Whisper: a check
  that the transcriber runs here before eleven-left-nemotron, and the smallest Whisper-against-Nemotron comparison
  (compare with jan29-left-comments).
source:
  urls:
    - https://www.youtube.com/watch?v=Kr5f5_Rt90Q
# Nemotron on a 16 GB Blackwell card (shiro, Nov 16): the NVFP4 checkpoint, 10 GiB of its experts in RAM, and 92% of
# the card for vLLM (at the card's 85% no room is left for its cache). It needs about 24 GiB of free RAM to start,
# and the first start builds FlashInfer kernels (prebuild them without the model on a 30 GiB machine: STATUS.md).
# FP8 needs about 30 GiB free. Speakers come with the words, so there is no diarize or align.
stages:
  - download: {}
  - audio: {channel: left}
  - nemotron_transcribe: {model: nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B-NVFP4, gpu_memory_utilization: 0.92}   # see the note above
  - turns: {max_gap_s: 30, max_turn_s: null}
  - code: {codebook: public-comment.yaml, instructions: extract_public_comments_v1.txt, mode: find, context: whole}
