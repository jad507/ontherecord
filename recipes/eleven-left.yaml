name: eleven-left
description: >-
  The 11 meetings (Oct 21 - Nov 25, 2025) that the ISLS 2027 paper left out of its corpus, done the intended way:
  diarization and transcription both from the left channel. Their stereo channels are inverted copies, so the
  averaged mono that pyannote read in May 2026 had canceled.
