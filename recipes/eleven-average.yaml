name: eleven-average
description: >-
  The same 11 meetings done the way hands_on_dl did before May 22, 2026: ffmpeg -ac 1 averages the two channels, and
  pyannote and Whisper both read that mono. Their channels are inverted copies, so the average cancels; the audio
  check fails, and on_fail continue lets the later stages run so the damage can be measured.
source:
  url_file: eleven-meetings.txt
stages:
  - download: {}
  - audio: {channel: average}
    on_fail: continue
  - diarize: {}
  - transcribe: {language: en}
  - align: {}
  - turns: {max_gap_s: 30, max_turn_s: null}   # as the study cut its speech blocks
  - code: {codebook: public-comment.yaml, instructions: extract_public_comments_v1.txt, mode: find, context: whole}
