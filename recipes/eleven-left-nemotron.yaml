name: eleven-left-nemotron
description: >-
  eleven-left with Nemotron 3.5 Transcribe (FP8, experts in RAM) in place of pyannote and Whisper, to compare
  the two on the same left-channel audio (download and audio are reused from eleven-left's runs). Meetings
  longer than an hour are cut into pieces, and speakers are numbered per piece.
source:
  url_file: eleven-meetings.txt
# Nemotron on a 16 GB Blackwell card (shiro, Nov 16): the NVFP4 checkpoint, 10 GiB of its experts in RAM, and 92% of
# the card for vLLM (at the card's 85% no room is left for its cache). It needs about 24 GiB of free RAM to start,
# and the first start builds FlashInfer kernels (prebuild them without the model on a 30 GiB machine: STATUS.md).
# FP8 needs about 30 GiB free. Speakers come with the words, so there is no diarize or align.
stages:
  - download: {}
  - audio: {channel: left}
  - nemotron_transcribe: {model: nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B-NVFP4, gpu_memory_utilization: 0.92}   # see below
  - turns: {max_gap_s: 30, max_turn_s: null}   # as the study cut its speech blocks
  - code: {codebook: public-comment.yaml, instructions: extract_public_comments_v1.txt, mode: find, context: whole}
