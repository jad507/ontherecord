name: example-interviews
description: >-
  An example two-pass study to copy: recorded interviews in, coded stories out. Put your recordings (audio or
  video) in a folder named interviews beside this file, or change files: below. Speakers, transcript and speaker
  turns; then pass one finds the personal stories, the excerpts step cuts them out, and pass two labels each story
  with any of four themes. Swap in your own codebooks (see src/ontherecord/codebooks/) and keep the rest.
source:
  files: [interviews/*]
stages:
  - download: {}               # for files, this copies and fingerprints them
  - audio: {}
  - diarize: {}
  - transcribe: {}             # language: empty, so Whisper detects it; or set e.g. language: es
  - align: {}
  - turns: {}
  - code: {codebook: example-stories.yaml, mode: find, context: whole}
  - excerpts: {codes: personal_story}
  - code: {codebook: example-story-themes.yaml, mode: classify, context: unit}
    as: themes

# To code the whole transcript instead (no first pass, nothing cut out): end the stages after turns with one code
# step, e.g.
#   - code: {codebook: example-story-themes.yaml, mode: classify, context: window}
# mode: classify gives every turn an answer (codes, or none); mode: find lists only the stretches that take a code.
# context: unit (each turn alone), window (each turn with window_size neighbors either side) or whole (the whole
# recording at once).
