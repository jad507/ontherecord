name: eleven-as-coded
description: >-
  What the ISLS 2027 paper's Oct 17 coding runs actually read for these 11 meetings: speaker turns from pyannote
  on the averaged audio (run May 15, 2026, and never redone) and words from Whisper on the left channel (redone
  after the May 22 fix). Align joins the two, so its same_source check fails; on_fail continue lets it run anyway
  to reproduce what the coders saw.
source:
  urls:
    - https://www.youtube.com/watch?v=pkVzY-53sJI   # City Council Budget Hearing - October 21, 2025
    - https://www.youtube.com/watch?v=Ffwwu-vf22M   # City Council Meeting - October 28, 2025
    - https://www.youtube.com/watch?v=mPnWxdvDGQA   # Home Rule Transition Committee Meeting - October 29, 2025
    - https://www.youtube.com/watch?v=nE5HiAtqwpA   # City Council Committee Meeting - November 3, 2025
    - https://www.youtube.com/watch?v=VZRKugPc6QU   # City Council Ethics Code Work Session - November 6, 2025
    - https://www.youtube.com/watch?v=X3DupuiqLts   # City Council Meeting - November 11, 2025
    - https://www.youtube.com/watch?v=Wof-B6HAg2g   # Traffic Commission Meeting - November 11, 2025
    - https://www.youtube.com/watch?v=W6aSdOttjPk   # City Council Budget Hearing - November 18, 2025
    - https://www.youtube.com/watch?v=aZVPtb9bsEE   # City Council Special Meeting - November 20, 2025
    - https://www.youtube.com/watch?v=Re1Nhz9g1aM   # City Council Meeting - November 25, 2025
    - https://www.youtube.com/watch?v=WHN2o2S6X-Q   # Press Conference - Data Center Community Benefits Agreement
stages:
  - download: {}
  - audio: {channel: average}
    as: audio_average
    on_fail: continue
  - audio: {channel: left}
  - diarize: {}
    from: {audio: audio_average}
  - transcribe: {}
  - align: {}
    on_fail: continue
  - blocks: {}
  - extract_comments: {}
