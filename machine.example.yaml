# Copy to machine.yaml (beside this file, or in your user config directory) and edit for this machine.
# Everything here is about *where things are*; recipes say *what to run*. Omit any line to take its default.

# Where downloads, stage outputs, receipts and run records go. Meeting audio lives here: keep it off shared drives
# your ethics approval does not cover.
workspace: ~/ontherecord-workspace

# Which Python runs each group of stages. Omit a group to use the Python that runs ontherecord itself.
# "audio" stages need torch, pyannote.audio, faster-whisper, soundfile, numpy and yt-dlp.
envs:
  audio: ~/src/hands_on_dl/.venv-audio/bin/python      # Windows: C:\path\to\.venv-audio\Scripts\python.exe
  stress: ~/src/.venv-stress/bin/python                # the stress test stages: transformers 5, librosa, pyarrow

# Binaries. Omit to find them on PATH.
tools:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  llama_server: ~/src/llama.cpp-b11249-cuda12.8/llama-b11249/llama-server

# yt-dlp needs a JavaScript runtime to download from YouTube: it runs JavaScript that YouTube serves. Use deno
# (https://deno.com), which yt-dlp runs with no file, network or environment access. bun and node have no sandbox,
# so that JavaScript would run with all of your account's permissions.
js_runtime:
  deno: ~/.deno/bin/deno

# Model files named in recipes (e.g. extract_comments.model) are looked up here.
models_root: ~/models

# KEY=VALUE lines handed to stage processes, e.g. HF_TOKEN for pyannote's gated model. Values are never recorded.
# env_file: ~/src/hands_on_dl/.env

# Plain environment settings for stage processes (recorded in receipts).
stage_env:
  HF_HUB_OFFLINE: "1"     # use models already in the Hugging Face cache; no network, no token needed

# cookies_file: ~/youtube_cookies.txt   # only if YouTube insists you sign in; never recorded

# Where imports from cameras and drives are filed (Import tab, `ontherecord ingest`). An external drive is fine: the
# archive's catalog and import manifests live inside it, in _ingests/.
# archive: ~/OnTheRecord-Archive

# The assistant (the Ask tab, `ontherecord ask`): a small model on llama-server. It never runs beside a job (it
# switches off while one runs or waits), so by default it takes as much of the GPU as fits (gpu_layers: auto);
# a number sets the layers on the GPU, 0 keeps it on the CPU. `endpoint` uses a server already running.
# assistant:
#   model: gemma-4-E4B_q4_0-it.gguf             # relative to models_root
#   gpu_layers: auto
#   context: 16384
